<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Lead Manager</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f0f4f8;
    color: #1e293b;
    margin: 0;
    line-height: 1.6;
}

header {
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    color: white;
    padding: 30px 20px;
    box-shadow: 0 4px 12px #1e3a8a20;
}

.header-content {
    max-width: 1000px;
    margin: auto;
}

header h1 {
    margin: 0 0 6px;
    font-size: 28px;
}

header p {
    margin: 0;
    color: #dbeafe;
}

main {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 15px;
    margin-bottom: 22px;
}

.card {
    background: white;
    padding: 20px 12px;
    border-radius: 14px;
    text-align: center;
    box-shadow: 0 4px 14px #0f172a0c;
    border: 1px solid #e2e8f0;
}

.card .icon {
    font-size: 25px;
}

.card p {
    color: #64748b;
    margin: 5px 0;
    font-size: 14px;
}

.card h2 {
    color: #2563eb;
    margin: 4px 0 0;
    font-size: 30px;
}

.panel {
    background: white;
    padding: 22px;
    border-radius: 14px;
    margin-bottom: 20px;
    box-shadow: 0 4px 14px #0f172a0c;
    border: 1px solid #e2e8f0;
}

.panel h2 {
    margin-top: 0;
    color: #1e3a8a;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

input, select, button {
    width: 100%;
    padding: 13px;
    margin: 6px 0;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
}

input:focus, select:focus {
    outline: 2px solid #93c5fd;
    border-color: #2563eb;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #1d4ed8;
}

.primary-button {
    margin-top: 12px;
}

.search-box {
    margin-bottom: 12px;
}

.lead {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-left: 4px solid #3b82f6;
    border-radius: 10px;
    padding: 16px;
    margin-top: 14px;
    overflow-wrap: anywhere;
}

.lead h3 {
    margin: 0 0 10px;
    color: #1e40af;
}

.lead p {
    margin: 7px 0;
}

.status-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    background: #dbeafe;
    color: #1d4ed8;
}

.status-contacted {
    background: #fef3c7;
    color: #92400e;
}

.status-converted {
    background: #dcfce7;
    color: #166534;
}

.lead-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

.delete-button {
    background: #dc2626;
}

.delete-button:hover {
    background: #b91c1c;
}

.empty-message {
    text-align: center;
    padding: 25px 10px;
    color: #64748b;
}

footer {
    text-align: center;
    padding: 20px;
    color: #64748b;
}

@media (max-width: 600px) {
    header {
        padding: 24px 16px;
    }

    header h1 {
        font-size: 23px;
    }

    main {
        padding: 12px;
    }

    .cards {
        gap: 8px;
    }

    .card {
        padding: 12px 4px;
    }

    .card .icon {
        font-size: 21px;
    }

    .card h2 {
        font-size: 24px;
    }

    .card p {
        font-size: 12px;
    }

    .panel {
        padding: 16px;
    }

    .form-grid {
        grid-template-columns: 1fr;
        gap: 0;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-content">
        <h1>📊 Client Lead Manager</h1>
        <p>Manage clients, track leads, and grow your business.</p>
    </div>
</header>

<main>

    <div class="cards">
        <div class="card">
            <div class="icon">👥</div>
            <p>Total Leads</p>
            <h2 id="total">0</h2>
        </div>

        <div class="card">
            <div class="icon">📞</div>
            <p>Contacted</p>
            <h2 id="contacted">0</h2>
        </div>

        <div class="card">
            <div class="icon">✅</div>
            <p>Converted</p>
            <h2 id="converted">0</h2>
        </div>
    </div>

    <section class="panel">
        <h2>➕ Add New Client</h2>

        <form id="leadForm">
            <div class="form-grid">
                <input
                    id="name"
                    type="text"
                    placeholder="Client Name *"
                    required
                >

                <input
                    id="phone"
                    type="tel"
                    placeholder="Phone Number *"
                    required
                >

                <input
                    id="email"
                    type="email"
                    placeholder="Email Address (optional)"
                >

                <input
                    id="interest"
                    type="text"
                    placeholder="Product or Service *"
                    required
                >
            </div>

            <button class="primary-button" type="submit">
                + Add Client
            </button>
        </form>
    </section>

    <section class="panel">
        <h2>👤 Client List</h2>

        <input
            class="search-box"
            id="search"
            type="search"
            placeholder="🔍 Search by name, phone, email..."
        >

        <div id="leadList"></div>
    </section>

</main>

<footer>
    <p>Client Lead Management System</p>
    <p>Built with HTML, CSS and JavaScript ❤️</p>
</footer>

<script>
let leads = [];

try {
    const savedLeads = localStorage.getItem("clientLeads");
    leads = savedLeads ? JSON.parse(savedLeads) : [];

    if (!Array.isArray(leads)) {
        leads = [];
    }
} catch (error) {
    leads = [];
}

const form = document.getElementById("leadForm");
const searchInput = document.getElementById("search");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const lead = {
        id: Date.now(),
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        interest: document.getElementById("interest").value.trim(),
        status: "New"
    };

    if (!lead.name || !lead.phone || !lead.interest) {
        alert("Please fill in all required fields.");
        return;
    }

    leads.push(lead);
    saveLeads();

    form.reset();
    renderLeads();

    alert("Client added successfully!");
});

function saveLeads() {
    try {
        localStorage.setItem("clientLeads", JSON.stringify(leads));
    } catch (error) {
        alert("Your browser could not save the data.");
    }
}

function updateStatus(id, newStatus) {
    leads = leads.map(function(lead) {
        if (lead.id === id) {
            return { ...lead, status: newStatus };
        }
        return lead;
    });

    saveLeads();
    renderLeads();
}

function deleteLead(id) {
    if (confirm("Are you sure you want to delete this client?")) {
        leads = leads.filter(function(lead) {
            return lead.id !== id;
        });

        saveLeads();
        renderLeads();
    }
}

function renderLeads() {
    const query = searchInput.value.toLowerCase().trim();

    const filteredLeads = leads.filter(function(lead) {
        return [
            lead.name,
            lead.phone,
            lead.email || "",
            lead.interest
        ].some(function(value) {
            return String(value).toLowerCase().includes(query);
        });
    });

    document.getElementById("total").textContent = leads.length;

    document.getElementById("contacted").textContent =
        leads.filter(function(lead) {
            return lead.status === "Contacted";
        }).length;

    document.getElementById("converted").textContent =
        leads.filter(function(lead) {
            return lead.status === "Converted";
        }).length;

    const list = document.getElementById("leadList");
    list.replaceChildren();

    if (filteredLeads.length === 0) {
        const message = document.createElement("div");
        message.className = "empty-message";
        message.textContent = query
            ? "No matching clients found."
            : "No clients added yet. Add your first client above.";
        list.appendChild(message);
        return;
    }

    filteredLeads.forEach(function(lead) {
        const card = document.createElement("article");
        card.className = "lead";

        const title = document.createElement("h3");
        title.textContent = lead.name;
        card.appendChild(title);

        const badge = document.createElement("span");
        badge.className = "status-badge";

        if (lead.status === "Contacted") {
            badge.classList.add("status-contacted");
        } else if (lead.status === "Converted") {
            badge.classList.add("status-converted");
        }

        badge.textContent = lead.status;
        card.appendChild(badge);

        const details = [
            "📞 Phone: " + lead.phone,
            "✉️ Email: " + (lead.email || "Not provided"),
            "💼 Interested in: " + lead.interest
        ];

        details.forEach(function(detail) {
            const paragraph = document.createElement("p");
            paragraph.textContent = detail;
            card.appendChild(paragraph);
        });

        const statusLabel = document.createElement("label");
        statusLabel.textContent = "Update status";
        statusLabel.htmlFor = "status-" + lead.id;
        card.appendChild(statusLabel);

        const statusSelect = document.createElement("select");
        statusSelect.id = "status-" + lead.id;

        ["New", "Contacted", "Converted"].forEach(function(status) {
            const option = document.createElement("option");
            option.value = status;
            option.textContent = status;
            statusSelect.appendChild(option);
        });

        statusSelect.value = lead.status;

        statusSelect.addEventListener("change", function() {
            updateStatus(lead.id, statusSelect.value);
        });

        card.appendChild(statusSelect);

        const actions = document.createElement("div");
        actions.className = "lead-actions";

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "🗑 Delete";
        deleteButton.className = "delete-button";
        deleteButton.type = "button";

        deleteButton.addEventListener("click", function() {
            deleteLead(lead.id);
        });

        actions.appendChild(deleteButton);
        card.appendChild(actions);
        list.appendChild(card);
    });
}

searchInput.addEventListener("input", renderLeads);

renderLeads();
</script>

</body>
</html>
