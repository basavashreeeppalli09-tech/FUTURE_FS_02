<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Client Lead Manager</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: linear-gradient(135deg, #10264c, #2161f5, #75c6ff);
}

.login-card {
  width: 100%;
  max-width: 400px;
  padding: 35px 28px;
  background: white;
  border-radius: 22px;
  box-shadow: 0 20px 60px #071b3b55;
}

.logo {
  font-size: 48px;
  text-align: center;
  margin-bottom: 12px;
}

h1 {
  color: #142b4e;
  text-align: center;
  font-size: 26px;
  margin-bottom: 8px;
}

.subtitle {
  color: #7185a2;
  text-align: center;
  font-size: 14px;
  margin-bottom: 28px;
  line-height: 1.5;
}

label {
  display: block;
  margin: 16px 0 8px;
  color: #263e60;
  font-size: 14px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d6e2f6;
  border-radius: 10px;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #2161f5;
  box-shadow: 0 0 0 3px #2161f51a;
}

button {
  width: 100%;
  margin-top: 24px;
  padding: 15px;
  background: linear-gradient(110deg, #2161f5, #3989ff);
  border: none;
  border-radius: 10px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

.message {
  margin-top: 16px;
  text-align: center;
  font-size: 13px;
  line-height: 1.5;
}

.footer {
  text-align: center;
  color: #7185a2;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>
<div class="login-card">
  <div class="logo">👥</div>
  <h1>Welcome Back!</h1>
  <p class="subtitle">
    Sign in to your Client Lead Management dashboard.
  </p>

  <form id="loginForm">
    <label for="email">Email Address</label>
    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="username"
      required
    >

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

    <button type="submit">Sign In →</button>
    <p class="message" id="message" role="status"></p>
  </form>

  <p class="footer">Client Lead Management System</p>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
  event.preventDefault();

  document.getElementById("message").textContent =
    "This is a demo login screen. Secure login needs a backend authentication service.";
  document.getElementById("message").style.color = "#b45309";
});
</script>
</body>
</html>
